name: Publish Home Assistant add-on images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Add-on version to publish (without the leading v)
        required: true
        default: "0.1.19"
        type: string
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    name: Build and publish ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be a numeric semantic version, got: ${VERSION}" >&2
            exit 1
          fi
          docker buildx build \
            --platform "${PLATFORM}" \
            --file paseo/Dockerfile \
            --cache-from "type=gha,scope=hass-paseo-${ARCH}" \
            --cache-to "type=gha,mode=max,scope=hass-paseo-${ARCH}" \
            --build-arg BUILD_ARCH="${ARCH}" \
            --build-arg PASEO_VERSION=0.7.2 \
            --build-arg PASEO_COMMIT=9400a49af670fdb5db4af58e73f8df98588dbea9 \
            --build-arg CODEX_VERSION=0.160.0 \
            --build-arg CODEX_RELEASE_TAG=rust-v0.160.0 \
            --build-arg CLAUDE_CODE_VERSION=2.1.289 \
            --build-arg OPENCODE_VERSION=1.18.34 \
            --build-arg PI_CODING_AGENT_VERSION=0.73.1 \
            --build-arg PI_MCP_ADAPTER_VERSION=1.5.1 \
            --build-arg COPILOT_CLI_VERSION=1.0.91 \
            --build-arg CURSOR_AGENT_VERSION=2026.10.01-e373342 \
            --build-arg CURSOR_AGENT_SHA256_AMD64=a79726c6e644520e993970be4c45775a6889802b67abe461a677a53219ae28e8 \
            --build-arg CURSOR_AGENT_SHA256_AARCH64=785c5f6bf2a60eb1121e27ed8c14f5ee07ed1b5b6692324f2d9a997238245eb5 \
            --build-arg HA_CLI_VERSION=5.5.0 \
            --build-arg HA_CLI_SHA256_AMD64=fb2e2177bd7bc014f029b807cd1cc7d74484ecfed1e90d5f9b2a61d65ff5393d \
            --build-arg HA_CLI_SHA256_AARCH64=af390ab7f91a8135668ace7b1425d8e53800b6a1fc3b36fc588df701d2ab3db5 \
            --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${ARCH}-addon-hass-paseo:${VERSION}" \
            --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${ARCH}-addon-hass-paseo:latest" \
            --push \
            paseo
