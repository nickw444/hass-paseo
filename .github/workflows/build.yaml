name: Publish Home Assistant add-on images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Add-on version to publish (without the leading v)
        required: true
        default: "0.1.0"
        type: string
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    name: Build and publish ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be a numeric semantic version, got: ${VERSION}" >&2
            exit 1
          fi
          docker buildx build \
            --platform "${PLATFORM}" \
            --file paseo/Dockerfile \
            --build-arg BUILD_ARCH="${ARCH}" \
            --build-arg PASEO_VERSION=0.7.2 \
            --build-arg PASEO_COMMIT=9400a49af670fdb5db4af58e73f8df98588dbea9 \
            --build-arg CODEX_VERSION=0.152.1 \
            --build-arg CODEX_RELEASE_TAG=rust-v0.152.1 \
            --build-arg CLAUDE_CODE_VERSION=2.1.259 \
            --build-arg OPENCODE_VERSION=1.18.27 \
            --build-arg PI_CODING_AGENT_VERSION=0.73.1 \
            --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${ARCH}-addon-hass-paseo:${VERSION}" \
            --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${ARCH}-addon-hass-paseo:latest" \
            --push \
            paseo
