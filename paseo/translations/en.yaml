configuration:
  ha_mcp_url:
    name: Home Assistant MCP URL
    description: Optional raw MCP endpoint URL copied from the Home Assistant MCP add-on logs. Leave blank to disable Home Assistant MCP.
  codex_remote_control:
    name: Enable Codex Remote Control
    description: Start the outbound Codex Remote Control daemon after Codex is authenticated. Pair native clients manually from a Paseo terminal.
