name: Paseo
version: "0.1.2"
slug: paseo
description: Paseo coding agent orchestrator for Home Assistant
url: https://github.com/getpaseo/paseo
arch:
  - amd64
  - aarch64

init: false
backup: cold
ingress: true
ingress_entry: /
ingress_stream: true
panel_icon: mdi:code-braces

image: ghcr.io/nickw444/{arch}-addon-hass-paseo

map:
  - type: homeassistant_config
    read_only: false
    path: /config

options:
  codex_remote_control: true

schema:
  ha_mcp_url: url?
  codex_remote_control: bool
