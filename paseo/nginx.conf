worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events { worker_connections 1024; }

http {
  access_log /dev/stdout;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Home Assistant sends the ingress mount as /api/hassio_ingress/<token>.
  # Canonicalize it once so a proxy/header trailing slash can never produce
  # duplicate separators in rewritten asset, router, or WebSocket URLs.
  # An empty value is allowed for Supervisor health checks; all other values
  # must match the Supervisor ingress route and URL-safe token grammar.
  map $http_x_ingress_path $paseo_ingress_path {
    default "";
    "" "";
    ~^/(?<paseo_ingress_capture>api/hassio_ingress/[A-Za-z0-9_-]+)/?$ /$paseo_ingress_capture;
  }
  map $http_x_ingress_path $paseo_ingress_path_valid {
    default 0;
    "" 1;
    ~^/api/hassio_ingress/[A-Za-z0-9_-]+/?$ 1;
  }

  server {
    listen 8099;
    server_name _;

    allow 172.30.32.2;
    deny all;

    if ($paseo_ingress_path_valid = 0) { return 400; }

    # Static bundles can contain literal HTML templates (including
    # "</head>"). Rewrite the ingress sentinel here, but never inject the
    # HTML bootstrap script into JavaScript/CSS/JSON.
    location ~* ^/(?:_expo/|assets/|(?:manifest|metadata)\.json(?:$|[.?])|(?:favicon\.ico|apple-touch-icon\.png|pwa-icon-[0-9]+\.png|robots\.txt)) {
      proxy_pass http://127.0.0.1:6767;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Ingress-Path $paseo_ingress_path;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Accept-Encoding "";

      sub_filter_types text/css application/javascript text/javascript application/json application/manifest+json;
      sub_filter_once off;
      sub_filter /__PASEO_INGRESS__ $paseo_ingress_path;
      add_header Vary X-Ingress-Path always;
      add_header Cache-Control "no-store" always;
    }

    # Root and deep-link routes return HTML. This is the only location that
    # injects runtime bootstrap state for the browser client.
    location / {
      proxy_pass http://127.0.0.1:6767;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Ingress-Path $paseo_ingress_path;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Accept-Encoding "";

      sub_filter_once off;
      sub_filter /__PASEO_INGRESS__ $paseo_ingress_path;
      sub_filter '</head>' '<script>window.__PASEO_WEB_BASE_PATH__=\"$paseo_ingress_path\";window.__PASEO_INITIAL_DAEMON_CONNECTION__={listen:window.location.hostname+\":\"+(window.location.port||(window.location.protocol===\"https:\"?\"443\":\"80\")),useTls:window.location.protocol===\"https:\"};</script></head>';
      add_header Vary X-Ingress-Path always;
      add_header Cache-Control "no-store" always;
    }
  }
}
